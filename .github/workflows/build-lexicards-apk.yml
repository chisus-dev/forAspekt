name: Build LexiCards APK

on:
  push:
    branches:
      - build/vocab-cards-mvp-20260803
    paths:
      - 'vocab-cards/**'
      - '.github/workflows/build-lexicards-apk.yml'
  pull_request:
    paths:
      - 'vocab-cards/**'
      - '.github/workflows/build-lexicards-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK v0.2.0
        working-directory: vocab-cards
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LexiCards-v0.2.0-debug-apk
          path: vocab-cards/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
