<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LexiCards</title><style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#20211f;--muted:#74766f;--line:#deded7;--accent:#315b4b;--soft:#e5eee9;--bad:#8b3b35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{padding:22px 18px 12px;display:flex;justify-content:space-between;align-items:end}h1{margin:0;font-size:27px}.sub{color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 14px 14px;position:sticky;top:0;background:var(--bg);z-index:2}.tabs button{padding:11px 4px}.tabs .active{background:var(--accent);color:#fff}.page{display:none;padding:0 14px 26px}.page.active{display:block}.panel,.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 12px #00000008}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;color:var(--ink)}textarea{min-height:76px;resize:vertical}button{border:0;border-radius:12px;padding:12px 15px;background:var(--soft);color:var(--accent);font-weight:650}.primary{background:var(--accent);color:#fff}.danger{background:#f4e4e2;color:var(--bad)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.small{padding:8px 10px;font-size:13px}.translation,.example{border-left:3px solid var(--soft);padding-left:10px;margin-top:12px}.word{font-size:29px;font-weight:760}.translationTag{display:inline-block;background:var(--soft);padding:6px 9px;border-radius:999px;margin:4px 4px 0 0}.empty{text-align:center;color:var(--muted);padding:32px 10px}.question{font-size:25px;font-weight:740;margin:8px 0 14px}.context{padding:13px;border-radius:13px;background:#f4f3ee;margin:10px 0;line-height:1.45}.answer{margin-top:14px}.result{padding:12px;border-radius:12px;background:#f4f3ee;margin:12px 0}.ok{color:var(--accent)}.bad{color:var(--bad)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;text-align:center}.stat b{font-size:21px;display:block}.hint{font-size:13px;color:var(--muted);line-height:1.4}.hidden{display:none!important}
</style></head><body><header><div><h1>LexiCards</h1><div class="sub">Личные карточки без лишнего</div></div></header><nav class="tabs"><button data-tab="cards" class="active">Карточки</button><button data-tab="add">Добавить</button><button data-tab="study">Учить</button></nav>
<main><section id="cards" class="page active"><div id="stats" class="stats"></div><div id="cardList"></div></section>
<section id="add" class="page"><form id="cardForm" class="panel"><input id="editId" type="hidden"><label>Английское слово</label><input id="word" required autocomplete="off" placeholder="hesitate"><div class="row"><h3>Переводы</h3><button type="button" id="addTranslation" class="small">+ перевод</button></div><div id="translations"></div><div class="row"><h3>Примеры</h3><button type="button" id="addExample" class="small">+ пример</button></div><div id="examples"></div><p class="hint">Пример можно привязать к конкретному переводу. При проверке приложение попытается скрыть найденную форму слова целиком.</p><div class="row"><button type="button" id="cancelEdit">Очистить</button><button class="primary">Сохранить</button></div></form></section>
<section id="study" class="page"><div id="studyBox"></div></section></main>
<script>
const KEY='lexicards.v1';let cards=load(),current=null,lastCardId=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(cards));renderAll()}
const $=s=>document.querySelector(s),esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tab(id){document.querySelectorAll('.page,.tabs button').forEach(e=>e.classList.remove('active'));$('#'+id).classList.add('active');document.querySelector(`[data-tab="${id}"]`).classList.add('active');if(id==='study')nextQuestion()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function addTranslation(value=''){let d=document.createElement('div');d.className='translation row';d.innerHTML=`<input class="tr" placeholder="вариант перевода" value="${esc(value)}"><button type="button" class="danger small">×</button>`;d.querySelector('button').onclick=()=>{d.remove();refreshExampleSelects()};d.querySelector('input').oninput=refreshExampleSelects;$('#translations').append(d);refreshExampleSelects()}
function addExample(text='',trIndex=''){let d=document.createElement('div');d.className='example';d.innerHTML=`<textarea class="ex" placeholder="His hands never hesitated.">${esc(text)}</textarea><div class="row"><select class="exTr"></select><button type="button" class="danger small">Удалить</button></div>`;d.dataset.link=trIndex;d.querySelector('button').onclick=()=>d.remove();$('#examples').append(d);refreshExampleSelects()}
function refreshExampleSelects(){let vals=[...document.querySelectorAll('.tr')].map(x=>x.value.trim());document.querySelectorAll('.example').forEach(e=>{let s=e.querySelector('select'),cur=s.value||e.dataset.link;s.innerHTML='<option value="">Без привязки</option>'+vals.map((v,i)=>`<option value="${i}">${esc(v||'Перевод '+(i+1))}</option>`).join('');s.value=cur;e.dataset.link=''})}
$('#addTranslation').onclick=()=>addTranslation();$('#addExample').onclick=()=>addExample();$('#cancelEdit').onclick=resetForm;
function resetForm(){$('#cardForm').reset();$('#editId').value='';$('#translations').innerHTML='';$('#examples').innerHTML='';addTranslation()}
$('#cardForm').onsubmit=e=>{e.preventDefault();let word=$('#word').value.trim();let translations=[...document.querySelectorAll('.tr')].map(x=>x.value.trim()).filter(Boolean);if(!word||!translations.length){alert('Добавьте слово и хотя бы один перевод');return}let examples=[...document.querySelectorAll('.example')].map(x=>({text:x.querySelector('.ex').value.trim(),translationIndex:x.querySelector('.exTr').value===''?null:+x.querySelector('.exTr').value})).filter(x=>x.text);let id=$('#editId').value||crypto.randomUUID();let old=cards.find(c=>c.id===id);let card={id,word,translations,examples,createdAt:old?.createdAt||Date.now(),due:old?.due||Date.now(),interval:old?.interval||0.1,ease:old?.ease||2.3,lapses:old?.lapses||0,seen:old?.seen||0};cards=cards.filter(c=>c.id!==id);cards.push(card);save();resetForm();tab('cards')};
function renderAll(){let due=cards.filter(c=>c.due<=Date.now()).length;$('#stats').innerHTML=`<div class="stat"><b>${cards.length}</b>слов</div><div class="stat"><b>${due}</b>к повторению</div><div class="stat"><b>${cards.reduce((a,c)=>a+c.seen,0)}</b>ответов</div>`;$('#cardList').innerHTML=cards.length?cards.slice().sort((a,b)=>a.word.localeCompare(b.word)).map(c=>`<article class="item"><div class="row"><div><div class="word">${esc(c.word)}</div><div>${c.translations.map(t=>`<span class="translationTag">${esc(t)}</span>`).join('')}</div></div></div>${c.examples.slice(0,2).map(x=>`<div class="context">${esc(x.text)}</div>`).join('')}<div class="row"><button onclick="editCard('${c.id}')">Изменить</button><button class="danger" onclick="removeCard('${c.id}')">Удалить</button></div></article>`).join(''):'<div class="empty">Пока нет карточек. Добавьте первое слово.</div>'}
window.editCard=id=>{let c=cards.find(x=>x.id===id);resetForm();$('#editId').value=c.id;$('#word').value=c.word;$('#translations').innerHTML='';c.translations.forEach(addTranslation);$('#examples').innerHTML='';c.examples.forEach(x=>addExample(x.text,x.translationIndex??''));tab('add')};window.removeCard=id=>{if(confirm('Удалить карточку?')){cards=cards.filter(c=>c.id!==id);save()}};
function normalize(s){return s.toLowerCase().trim().replace(/[.,!?;:()"']/g,'').replace(/ё/g,'е').replace(/\s+/g,' ')}
function hideWord(sentence,word){let w=word.toLowerCase(),tokens=sentence.split(/(\s+|[.,!?;:()"'])/);let stem=w.length>5?w.slice(0,-2):w;let hit=false;let out=tokens.map(t=>{let n=t.toLowerCase().replace(/[^a-z-]/g,'');if(n&&(n===w||n.startsWith(stem))){hit=true;return'___'}return t}).join('');return hit?out:sentence+'  [___]'}
function choose(){let now=Date.now(),pool=cards.filter(c=>c.due<=now);if(!pool.length)pool=cards.slice().sort((a,b)=>a.due-b.due).slice(0,Math.min(5,cards.length));let eligible=pool.filter(c=>c.id!==lastCardId);return(eligible.length?eligible:pool)[Math.floor(Math.random()*(eligible.length?eligible:pool).length)]}
function nextQuestion(){if(!cards.length){$('#studyBox').innerHTML='<div class="empty">Сначала добавьте хотя бы одну карточку.</div>';return}let c=choose();if(!c)return;lastCardId=c.id;let modes=['all','context','reverse'];let mode=modes[Math.floor(Math.random()*modes.length)],idx=Math.floor(Math.random()*c.translations.length),ex=c.examples.filter(x=>mode!=='context'||x.translationIndex===idx)[0]||c.examples[0];if(mode==='context'&&!ex)mode='all';current={card:c,mode,idx,ex,answered:false};let prompt='',context='';if(mode==='all'){prompt=`Напишите переводы слова <span class="word">${esc(c.word)}</span>`;context=c.examples.map(x=>`<div class="context">${esc(x.text)}</div>`).join('')}else if(mode==='context'){prompt=`Как переводится <span class="word">${esc(c.word)}</span> здесь?`;context=`<div class="context">${esc(ex.text)}</div>`}else{prompt=`Напишите английское слово для: <span class="word">${esc(c.translations[idx])}</span>`;context=ex?`<div class="context">${esc(hideWord(ex.text,c.word))}</div>`:''}$('#studyBox').innerHTML=`<div class="panel"><div class="question">${prompt}</div>${context}<input id="answer" class="answer" autocomplete="off" placeholder="Ваш ответ"><button id="check" class="primary" style="width:100%;margin-top:10px">Проверить</button></div>`;$('#check').onclick=checkAnswer;$('#answer').onkeydown=e=>{if(e.key==='Enter')checkAnswer()}}
function checkAnswer(){if(current.answered)return;current.answered=true;let a=$('#answer').value, c=current.card, score=0,details='';if(current.mode==='all'){let chunks=normalize(a).split(/[,;/\n]+/).map(normalize).filter(Boolean);let hits=c.translations.filter(t=>chunks.some(x=>x===normalize(t)||x.includes(normalize(t))||normalize(t).includes(x)));score=hits.length/c.translations.length;details=`Вспомнено ${hits.length} из ${c.translations.length} (${Math.round(score*100)}%).<br>Ответы: ${c.translations.map(esc).join(', ')}`}else{let expected=current.mode==='reverse'?[c.word]:[c.translations[current.idx]];score=expected.some(x=>normalize(a)===normalize(x))?1:0;details=`Правильный ответ: ${expected.map(esc).join(', ')}`}let suggested=score>=.99?'good':score>=.5?'hard':'again';document.querySelector('.panel').insertAdjacentHTML('beforeend',`<div class="result ${score>=.99?'ok':'bad'}">${details}</div><div class="row"><button onclick="grade('again')">Не помню</button><button onclick="grade('hard')">С трудом</button><button class="primary" onclick="grade('good')">Помню</button></div><p class="hint">Приложение предлагает оценку «${suggested==='good'?'помню':suggested==='hard'?'с трудом':'не помню'}», но решение можно исправить вручную.</p>`);$('#check').classList.add('hidden')}
window.grade=q=>{let c=cards.find(x=>x.id===current.card.id),now=Date.now(),day=86400000;c.seen++;if(q==='again'){c.lapses++;c.ease=Math.max(1.3,c.ease-.18);c.interval=.08+Math.random()*.08}else if(q==='hard'){c.ease=Math.max(1.3,c.ease-.06);c.interval=Math.max(.25,c.interval*1.45)}else{c.ease=Math.min(3,c.ease+.04);c.interval=c.interval<1?1:Math.min(180,c.interval*c.ease)}c.due=now+c.interval*day;save();nextQuestion()};
resetForm();renderAll();
</script></body></html>
