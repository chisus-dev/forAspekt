<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0d1015">
  <title>LexiCards</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="patch-v3.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div><p class="eyebrow">Личный словарь</p><h1 id="pageTitle">Карточки</h1></div>
    </header>
    <main>
      <section class="page active" data-page="cards">
        <div id="dashboard" class="dashboard"></div>
        <div class="search-wrap"><span class="search-icon">⌕</span><input id="cardSearch" class="search-input" type="search" placeholder="Найти слово или перевод" autocomplete="off"></div>
        <div id="cardList" class="card-list"></div>
      </section>
      <section class="page" data-page="editor">
        <form id="cardForm" novalidate>
          <input id="editId" type="hidden">
          <div class="surface form-section">
            <label class="field-label" for="wordInput">Английское слово</label>
            <input id="wordInput" class="text-input word-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="hesitate">
            <p id="wordError" class="field-error hidden"></p>
            <div id="existingExampleSuggestions" class="suggestions hidden"></div>
          </div>
          <div class="section-heading"><div><h2>Переводы</h2><p>Каждый вариант отслеживается отдельно.</p></div><button id="addTranslationButton" class="compact-button" type="button">+ Добавить</button></div>
          <div id="translationList" class="stack"></div><p id="translationError" class="field-error hidden"></p>
          <div class="section-heading"><div><h2>Примеры</h2><p>Пример можно привязать к нужному значению.</p></div><button id="addExampleButton" class="compact-button" type="button">+ Добавить</button></div>
          <div id="exampleList" class="stack"></div>
          <div class="editor-actions"><button id="cancelEditButton" class="secondary-button" type="button">Очистить</button><button class="primary-button" type="submit">Сохранить карточку</button></div>
        </form>
      </section>
      <section class="page" data-page="study"><div id="studyContent"></div></section>
    </main>
    <nav class="bottom-nav">
      <button class="nav-item active" type="button" data-nav="cards"><span class="nav-icon">▤</span><span>Карточки</span></button>
      <button class="nav-item" type="button" data-nav="editor"><span class="nav-icon nav-plus">＋</span><span>Добавить</span></button>
      <button class="nav-item" type="button" data-nav="study"><span class="nav-icon">◆</span><span>Учить</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="modalBackdrop" class="modal-backdrop hidden"><div class="modal"><h3 id="modalTitle"></h3><p id="modalText"></p><div id="modalActions" class="modal-actions"></div></div></div>
  <script src="app-v3.js"></script>
</body>
</html>
